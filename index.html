<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leia Alta Gama - Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .img-vitrina { height: 200px; width: 100%; object-fit: contain; background-color: #f9fafb; border-radius: 1rem; }
        /* Forzamos que el modal inicie oculto con display: none !important */
        #pantallaDetalle { 
            display: none; 
            position: fixed; 
            z-index: 100; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); 
            backdrop-filter: blur(10px); 
            align-items: center; 
            justify-content: center;
        }
        .modal-animacion { animation: aparecer 0.2s ease-out; }
        @keyframes aparecer { from {opacity: 0; transform: scale(0.9);} to {opacity: 1; transform: scale(1);} }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-black text-white p-4 sticky top-0 z-50 border-b-2 border-yellow-500">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black italic tracking-tighter text-yellow-400">LEIA ALTA GAMA 👟</h1>
            <div class="relative w-full md:w-1/3">
                <input type="text" id="buscador" placeholder="Buscar modelo, marca o talla..." 
                    class="w-full p-2 pl-10 rounded-full text-black outline-none focus:ring-2 focus:ring-yellow-400">
                <i class="fa fa-search absolute left-3 top-3 text-gray-400"></i>
            </div>
        </div>
    </header>

    <div class="bg-blue-600 text-white text-center py-2 text-[10px] font-bold uppercase tracking-widest">
        🇵🇪 Envíos a todo el Perú - Lima, Arequipa y Provincias
    </div>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div id="contenedor-principal" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-8">
            <div id="loading" class="col-span-full text-center py-20">
                <div class="animate-spin inline-block w-10 h-10 border-4 border-yellow-500 border-t-transparent rounded-full mb-4"></div>
                <p class="text-gray-500 font-bold">Cargando catálogo...</p>
            </div>
        </div>
    </main>

    <div id="pantallaDetalle" onclick="cerrarDetalle()">
        <div class="bg-white rounded-3xl max-w-4xl w-full overflow-hidden flex flex-col md:flex-row relative modal-animacion" onclick="event.stopPropagation()">
            <button class="absolute top-4 right-4 text-gray-400 hover:text-black text-3xl z-10" onclick="cerrarDetalle()">&times;</button>
            
            <div class="md:w-1/2 bg-gray-50 p-6 flex items-center justify-center">
                <img id="detalleImg" src="" class="max-h-[350px] md:max-h-[500px] w-full object-contain">
            </div>
            
            <div class="md:w-1/2 p-8 flex flex-col justify-center">
                <h2 id="detalleNombre" class="text-2xl md:text-4xl font-black text-gray-900 uppercase mb-4 leading-none"></h2>
                <div class="space-y-4 mb-8">
                    <p class="text-gray-600">Color: <span id="detalleColor" class="font-bold text-black italic"></span></p>
                    <p class="text-gray-600 font-bold">Tallas: <span id="detalleTallas" class="text-blue-700"></span></p>
                    <div class="pt-4 border-t">
                        <p class="text-4xl font-black text-gray-900">S/ <span id="detallePrecio"></span></p>
                    </div>
                </div>
                <a id="detalleLinkWA" href="#" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-center py-4 rounded-2xl font-bold text-xl flex items-center justify-center gap-3 shadow-lg">
                    <i class="fab fa-whatsapp text-2xl"></i> CONSULTAR STOCK
                </a>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1ojKX-Rl3l6Mxeaa0Uv4eemXGumfqpDCcRqVCBHtfDsI'.trim(); // Limpiamos espacios
        const SHEET_NAME = 'Hoja1';
        const WHATSAPP = '51987840298';

        // Usamos una URL de respaldo por si el rango falla
        const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

        async function iniciarApp() {
            console.log("Iniciando conexión con Google Sheets...");
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("No se pudo conectar con Google");
                
                const text = await response.text();
                
                // Limpieza manual del JSON (más segura)
                const inicio = text.indexOf('{');
                const fin = text.lastIndexOf('}');
                const jsonLimpio = JSON.parse(text.substring(inicio, fin + 1));
                
                inventarioReal = jsonLimpio.table.rows;
                
                console.log("Datos recibidos:", inventarioReal.length, "filas");

                if (inventarioReal.length === 0) {
                    document.getElementById('loading').innerHTML = "El Excel parece estar vacío.";
                    return;
                }

                document.getElementById('loading').style.display = 'none';
                renderizar(inventarioReal);
            } catch (e) {
                console.error("Error en la carga:", e);
                document.getElementById('loading').innerHTML = `
                    <div class="text-red-500 p-4">
                        <i class="fa fa-exclamation-triangle text-2xl mb-2"></i><br>
                        <b>Error de Conexión</b><br>
                        <small>Asegúrate que el Google Sheet esté compartido como PUBLICO.</small><br>
                        <button onclick="location.reload()" class="mt-4 bg-gray-800 text-white px-4 py-2 rounded-lg text-xs">Reintentar</button>
                    </div>
                `;
            }
        }

        
function renderizar(datos) {
    const container = document.getElementById('contenedor-principal');
    container.innerHTML = '';

    console.log("Intentando renderizar total de filas:", datos.length);

    datos.forEach((fila, index) => {
        // Obtenemos el link de la imagen (Columna J es índice 9)
        // Usamos un método más robusto para extraer el valor
        const imgRaw = fila.c[9] ? (fila.c[9].v || "") : "";
        
        // Si la celda existe pero no tiene el link, intentamos con la Columna I (índice 8)
        const imagenFinal = imgRaw.toString().startsWith('http') ? imgRaw : 
                           (fila.c[8] && fila.c[8].v && fila.c[8].v.toString().startsWith('http') ? fila.c[8].v : null);

        // Si después de buscar no hay imagen, saltamos esta fila
        if (!imagenFinal) {
            console.warn(`Fila ${index + 1} saltada: No se encontró link de imagen válido.`);
            return;
        }

        const p = {
            nombre: (fila.c[6] && fila.c[6].v) ? fila.c[6].v : 'Zapatilla ' + (index + 1),
            precio: (fila.c[4] && fila.c[4].v) ? fila.c[4].v : 'Consultar',
            foto: imagenFinal,
            tallas: (fila.c[5] && fila.c[5].v) ? fila.c[5].v : 'S/T',
            color: (fila.c[2] && fila.c[2].v) ? fila.c[2].v : 'Ver detalle'
        };

        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-3xl shadow-sm border border-gray-100 cursor-pointer hover:shadow-lg transition-all";
        card.onclick = () => abrirDetalle(p);
        card.innerHTML = `
            <img src="${p.foto}" class="img-vitrina mb-4" loading="lazy">
            <div class="text-center">
                <h3 class="text-[11px] md:text-sm font-bold text-gray-800 uppercase truncate mb-1">${p.nombre}</h3>
                <p class="text-blue-700 font-black text-lg">S/ ${p.precio}</p>
            </div>
        `;
        container.appendChild(card);
    });
}


    
        function abrirDetalle(p) {
            document.getElementById('detalleImg').src = p.foto;
            document.getElementById('detalleNombre').innerText = p.nombre;
            document.getElementById('detalleColor').innerText = p.color;
            document.getElementById('detalleTallas').innerText = p.tallas;
            document.getElementById('detallePrecio').innerText = p.precio;
            
            const textoWA = `Hola Leia Alta Gama! 👋 Me interesa este modelo: ${p.nombre} (Talla: ${p.tallas})`;
            document.getElementById('detalleLinkWA').href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(textoWA)}`;
            
            // Aquí activamos el modal solo al hacer clic
            document.getElementById('pantallaDetalle').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function cerrarDetalle() {
            document.getElementById('pantallaDetalle').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('buscador').addEventListener('input', (e) => {
            const t = e.target.value.toLowerCase();
            const filtrados = inventarioReal.filter(f => {
                const meta = `${f.c[6]?.v} ${f.c[0]?.v} ${f.c[5]?.v}`.toLowerCase();
                return meta.includes(t);
            });
            renderizar(filtrados);
        });

        iniciarApp();
    </script>
</body>
</html>
