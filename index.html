<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leia Alta Gama - Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .img-vitrina { height: 200px; width: 100%; object-fit: contain; background-color: #f9fafb; border-radius: 1rem; transition: transform 0.3s; }
        .card-zapatilla:hover .img-vitrina { transform: scale(1.05); }
        
        #pantallaDetalle { 
            display: none; 
            position: fixed; 
            z-index: 100; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); 
            backdrop-filter: blur(10px); 
            align-items: center; 
            justify-content: center;
        }
        .modal-animacion { animation: aparecer 0.2s ease-out; }
        @keyframes aparecer { from {opacity: 0; transform: scale(0.95);} to {opacity: 1; transform: scale(1);} }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <header class="bg-black text-white p-4 sticky top-0 z-50 border-b-2 border-yellow-500">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black italic tracking-tighter text-yellow-400 uppercase">LEIA ALTA GAMA 👟</h1>
            <div class="relative w-full md:w-1/3">
                <input type="text" id="buscador" placeholder="Buscar modelo, marca o talla..." 
                    class="w-full p-2 pl-10 rounded-full text-black outline-none focus:ring-2 focus:ring-yellow-400 shadow-inner">
                <i class="fa fa-search absolute left-3 top-3 text-gray-400"></i>
            </div>
        </div>
    </header>

    <div class="bg-blue-600 text-white text-center py-2 text-[10px] md:text-xs font-bold uppercase tracking-widest shadow-md">
        🇵🇪 Envíos garantizados a Lima, Arequipa y todo el Perú
    </div>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div id="contenedor-principal" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-8">
            <div id="loading" class="col-span-full text-center py-20">
                <div class="animate-spin inline-block w-10 h-10 border-4 border-yellow-500 border-t-transparent rounded-full mb-4"></div>
                <p class="text-gray-500 font-bold">Sincronizando con el almacén...</p>
            </div>
        </div>
    </main>

    <div id="pantallaDetalle" onclick="cerrarDetalle()">
        <div class="bg-white rounded-3xl max-w-4xl w-full overflow-hidden flex flex-col md:flex-row relative modal-animacion shadow-2xl mx-4" onclick="event.stopPropagation()">
            <button class="absolute top-4 right-4 text-gray-400 hover:text-black text-3xl z-10 p-2" onclick="cerrarDetalle()">&times;</button>
            <div class="md:w-1/2 bg-gray-50 p-6 flex items-center justify-center border-b md:border-b-0 md:border-r">
                <img id="detalleImg" src="" class="max-h-[300px] md:max-h-[500px] w-full object-contain drop-shadow-2xl">
            </div>
            <div class="md:w-1/2 p-8 flex flex-col justify-center">
                <h2 id="detalleNombre" class="text-2xl md:text-4xl font-black text-gray-900 uppercase mb-4 leading-tight"></h2>
                <div class="space-y-4 mb-8">
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="text-gray-500 font-medium">Color:</span>
                        <span id="detalleColor" class="font-bold text-gray-800 italic uppercase"></span>
                    </div>
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="text-gray-500 font-medium">Tallas Disponibles:</span>
                        <span id="detalleTallas" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg font-bold text-sm"></span>
                    </div>
                    <div class="pt-4">
                        <span class="text-xs text-gray-400 font-bold uppercase tracking-widest">Precio Oferta</span>
                        <p class="text-5xl font-black text-gray-900 leading-none">S/ <span id="detallePrecio"></span></p>
                    </div>
                </div>
                <a id="detalleLinkWA" href="#" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-center py-4 rounded-2xl font-bold text-xl flex items-center justify-center gap-3 shadow-lg transform active:scale-95 transition-all">
                    <i class="fab fa-whatsapp text-2xl"></i> PEDIR POR WHATSAPP
                </a>
            </div>
        </div>
    </div>

<script>
    const SHEET_ID = '1ojKX-Rl3l6Mxeaa0Uv4eemXGumfqpDCcRqVCBHtfDsI';
    const SHEET_NAME = 'Hoja1';
    const WHATSAPP = '51987840298';
    const URL_FINAL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

    let inventarioReal = [];

    async function iniciarApp() {
        try {
            const response = await fetch(URL_FINAL);
            const text = await response.text();
            const jsonLimpio = JSON.parse(text.substring(47).slice(0, -2));
            inventarioReal = jsonLimpio.table.rows;
            document.getElementById('loading').style.display = 'none';
            renderizar(inventarioReal);
        } catch (e) {
            console.error("Error:", e);
        }
    }

    function renderizar(datos) {
        const container = document.getElementById('contenedor-principal');
        container.innerHTML = '';

        datos.forEach((fila, index) => {
            const nombre = fila.c[6]?.v || `Producto fila ${index + 1}`;
            const precio = fila.c[4]?.v || "0";
            const talla = fila.c[5]?.v || "S/T";
            const color = fila.c[2]?.v || "Varios";
            const marca = fila.c[0]?.v || "";
            
            let foto = fila.c[9]?.v || fila.c[8]?.v || fila.c[7]?.v || "";
            if (!foto.toString().startsWith('http')) {
                foto = "https://via.placeholder.com/400x400?text=Falta+Imagen";
            }

            const p = { nombre, precio, foto, tallas: talla, color, marca };

            const card = document.createElement('div');
            card.className = "bg-white p-4 rounded-3xl shadow-sm border border-gray-100 cursor-pointer hover:shadow-lg transition-all";
            // Usamos una forma más segura de pasar el objeto a la función
            card.onclick = () => verDetalle(p);
            
            card.innerHTML = `
                <img src="${p.foto}" class="img-vitrina mb-4">
                <div class="text-center">
                    <h3 class="text-[11px] font-bold uppercase truncate">${p.nombre}</h3>
                    <p class="text-blue-700 font-black italic text-lg">S/ ${p.precio}</p>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // --- NUEVO BUSCADOR CONECTADO ---
    document.getElementById('buscador').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        
        const filtrados = inventarioReal.filter(fila => {
            // Extraemos los textos de las columnas clave
            const nombre = (fila.c[6]?.v || "").toString().toLowerCase();
            const marca = (fila.c[0]?.v || "").toString().toLowerCase();
            const color = (fila.c[2]?.v || "").toString().toLowerCase();
            const talla = (fila.c[5]?.v || "").toString().toLowerCase();

            // Si el término está en cualquiera de estos campos, se queda
            return nombre.includes(term) || marca.includes(term) || color.includes(term) || talla.includes(term);
        });

        renderizar(filtrados);
    });

    function verDetalle(p) {
        document.getElementById('detalleImg').src = p.foto;
        document.getElementById('detalleNombre').innerText = p.nombre;
        document.getElementById('detalleColor').innerText = p.color;
        document.getElementById('detalleTallas').innerText = p.tallas;
        document.getElementById('detallePrecio').innerText = p.precio;
        
        const textoWA = `¡Hola Leia Alta Gama! 👋 Me interesa:\n*${p.nombre}*\nColor: ${p.color}\nTallas: ${p.tallas}\nPrecio: S/ ${p.precio}`;
        document.getElementById('detalleLinkWA').href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(textoWA)}`;
        
        document.getElementById('pantallaDetalle').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function cerrarDetalle() {
        document.getElementById('pantallaDetalle').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    iniciarApp();
</script>
</body>
</html>
