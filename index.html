<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leia Alta Gama - Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Ajuste de imágenes en la vitrina principal */
        .img-vitrina { height: 180px; width: 100%; object-fit: contain; }
        
        /* Estilo del Modal (Ventana flotante) */
        .modal-background { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .modal-animacion { animation: aparecer 0.3s ease-out; }
        @keyframes aparecer { from {opacity: 0; transform: scale(0.9);} to {opacity: 1; transform: scale(1);} }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-black text-white p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black italic text-yellow-400">LEIA ALTA GAMA 👟</h1>
            <input type="text" id="buscador" placeholder="Buscar modelo o talla..." 
                class="w-full md:w-1/3 p-2 rounded-full text-black outline-none border-2 border-transparent focus:border-yellow-400">
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div id="contenedor-principal" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            </div>
    </main>

    <div id="pantallaDetalle" class="modal-background flex items-center justify-center p-4" onclick="cerrarDetalle()">
        <div class="bg-white rounded-3xl max-w-4xl w-full overflow-hidden flex flex-col md:flex-row modal-animacion" onclick="event.stopPropagation()">
            
            <div class="md:w-1/2 bg-gray-50 p-6 flex items-center justify-center">
                <img id="detalleImg" src="" class="max-h-[500px] w-full object-contain">
            </div>
            
            <div class="md:w-1/2 p-8 flex flex-col justify-center">
                <button class="self-end text-gray-400 text-3xl mb-4" onclick="cerrarDetalle()">&times;</button>
                <h2 id="detalleNombre" class="text-3xl font-black text-gray-800 uppercase mb-4"></h2>
                
                <div class="border-t border-b py-4 mb-6 space-y-2">
                    <p class="text-gray-600">Color Sugerido: <span id="detalleColor" class="font-bold text-black"></span></p>
                    <p class="text-gray-600">Tallas Disponibles: <span id="detalleTallas" class="font-bold text-blue-600"></span></p>
                    <div class="mt-4">
                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Precio Final</p>
                        <p class="text-5xl font-black text-gray-900">S/ <span id="detallePrecio"></span></p>
                    </div>
                </div>

                <a id="detalleLinkWA" href="#" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-center py-4 rounded-2xl font-bold text-xl flex items-center justify-center gap-3 transition-transform active:scale-95 shadow-xl">
                    <i class="fab fa-whatsapp"></i> ME INTERESA
                </a>
                <p class="text-center text-gray-400 text-xs mt-4">Envíos inmediatos a todo el Perú 🇵🇪</p>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1ojKX-Rl3l6Mxeaa0Uv4eemXGumfqpDCcRqVCBHtfDsI';
        const SHEET_NAME = 'Hoja1';
        const WHATSAPP = '51987840298';

        let productosBase = [];

        // 1. Cargar datos del Excel
        async function cargarInventario() {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
            const res = await fetch(url);
            const data = await res.text();
            const json = JSON.parse(data.substring(47).slice(0, -2));
            productosBase = json.table.rows;
            renderizarVitrina(productosBase);
        }

        // 2. Dibujar la vitrina (Todas las fotos juntas)
        function renderizarVitrina(lista) {
            const grid = document.getElementById('contenedor-principal');
            grid.innerHTML = '';

            lista.forEach(fila => {
                const img = fila.c[9]?.v; // Columna J
                if (!img) return;

                const prod = {
                    marca: fila.c[0]?.v || '',
                    color: fila.c[2]?.v || 'Normal',
                    precio: fila.c[4]?.v || '0',
                    tallas: fila.c[5]?.v || 'S/T',
                    nombre: fila.c[6]?.v || 'Zapatilla',
                    foto: img
                };

                // Crear tarjeta
                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-2xl shadow-sm hover:shadow-xl transition-all cursor-pointer border border-gray-100";
                card.onclick = () => abrirDetalle(prod); // Al hacer clic se abre el detalle
                
                card.innerHTML = `
                    <img src="${prod.foto}" class="img-vitrina rounded-xl mb-3" loading="lazy">
                    <h3 class="text-xs font-bold text-gray-700 uppercase truncate">${prod.nombre}</h3>
                    <p class="text-blue-700 font-black text-lg">S/ ${prod.precio}</p>
                `;
                grid.appendChild(card);
            });
        }

        // 3. Función para mostrar la foto en grande con sus datos
        function abrirDetalle(p) {
            document.getElementById('detalleImg').src = p.foto;
            document.getElementById('detalleNombre').innerText = p.nombre;
            document.getElementById('detalleColor').innerText = p.color;
            document.getElementById('detalleTallas').innerText = p.tallas;
            document.getElementById('detallePrecio').innerText = p.precio;
            
            const mensaje = `Hola Leia Alta Gama! Me interesa este modelo: ${p.nombre} en talla ${p.tallas}. ¿Tienen stock?`;
            document.getElementById('detalleLinkWA').href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
            
            document.getElementById('pantallaDetalle').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Bloquea el scroll de fondo
        }

        function cerrarDetalle() {
            document.getElementById('pantallaDetalle').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Buscador
        document.getElementById('buscador').addEventListener('input', (e) => {
            const busqueda = e.target.value.toLowerCase();
            const filtrados = productosBase.filter(f => {
                const contenido = (f.c[6]?.v + " " + f.c[5]?.v + " " + f.c[0]?.v).toLowerCase();
                return contenido.includes(busqueda);
            });
            renderizarVitrina(filtrados);
        });

        cargarInventario();
    </script>
</body>
</html>
