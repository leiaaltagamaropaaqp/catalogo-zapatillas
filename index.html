<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="https://res.cloudinary.com/leia-altagama/image/upload/v1773363458/Adidas_Duramo10Speed_RosadoPastel_tfqbvw.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Zapatillas Perú 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Estilo para que las imágenes mantengan su proporción sin cortarse */
        .img-zapatilla { object-fit: contain; height: 180px; width: 100%; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-black text-white p-4 sticky top-0 z-50 shadow-xl">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black italic tracking-tighter text-yellow-400">LEIA ALTA GAMA 👟</h1>
            <div class="relative w-full md:w-1/3">
                <input type="text" id="buscador" placeholder="Buscar modelo o marca..." 
                    class="w-full p-2 pl-10 rounded-full text-black focus:outline-none focus:ring-2 focus:ring-yellow-400">
                <i class="fa fa-search absolute left-3 top-3 text-gray-400"></i>
            </div>
        </div>
    </header>

    <div class="bg-blue-600 text-white text-center py-2 text-sm font-bold uppercase tracking-widest">
        🇵🇪 Envíos garantizados a Lima, Arequipa y todo el Perú
    </div>

    <main class="max-w-6xl mx-auto p-4 md:p-6">
        <div id="lista-zapatillas" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <div class="col-span-full text-center py-20">
                <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
                <p class="text-gray-500 font-medium">Cargando catálogo actualizado...</p>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // CONFIGURACIÓN: CAMBIA ESTOS DATOS
        // ==========================================
        const SHEET_ID = '1ojKX-Rl3l6Mxeaa0Uv4eemXGumfqpDCcRqVCBHtfDsI'; 
        const SHEET_NAME = 'Hoja1'; // Nombre de la pestaña en tu Excel
        const MI_WHATSAPP = '51987840298'; // Tu número con el 51 adelante
        
        // URL de la API de Google Sheets
        const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}&range=A1:I50`;

        let baseDeDatos = [];

        // Función para conectar con Google Sheets
        fetch(URL)
            .then(res => res.text())
            .then(data => {
                const temp = data.substring(47).slice(0, -2);
                const json = JSON.parse(temp);
                baseDeDatos = json.table.rows;
                console.log("Total de filas detectadas:", baseDeDatos.length);
                renderizar(baseDeDatos);
            })
            .catch(err => {
                console.error("Error cargando datos:", err);
                document.getElementById('lista-zapatillas').innerHTML = "<p class='col-span-full text-center text-red-500'>Error al conectar con Google Sheets. Revisa el ID y los permisos.</p>";
            });

        // Función para dibujar las zapatillas en la pantalla
        function renderizar(datos) {
            const contenedor = document.getElementById('lista-zapatillas');
            contenedor.innerHTML = '';

            datos.forEach(fila => {
                const nombre = fila.c[0] ? fila.c[1].v : 'Modelo sin nombre';
                const fotoUrl = fila.c[1] ? fila.c[8].v : 'https://via.placeholder.com/300';
                const precio = fila.c[2] ? fila.c[2].v : '---';

                contenedor.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300 overflow-hidden flex flex-col border border-gray-200">
                        <div class="p-2 bg-gray-50">
                            <img src="${fotoUrl}" alt="${nombre}" class="img-zapatilla rounded-lg">
                        </div>
                        <div class="p-4 flex flex-col flex-grow">
                            <h2 class="text-sm md:text-base font-bold text-gray-800 uppercase leading-tight mb-2">${nombre}</h2>
                            <div class="mt-auto">
                                <p class="text-xl font-black text-blue-700 mb-3">S/ ${precio}</p>
                                <a href="https://wa.me/${MI_WHATSAPP}?text=Hola! Me interesa el modelo: ${nombre}" 
                                   target="_blank"
                                   class="flex items-center justify-center gap-2 w-full bg-green-500 hover:bg-green-600 text-white py-2.5 rounded-xl font-bold text-sm transition-colors">
                                    <i class="fab fa-whatsapp text-lg"></i> CONSULTAR
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Lógica del buscador
        document.getElementById('buscador').addEventListener('input', (e) => {
            const termino = e.target.value.toLowerCase();
            const filtrados = baseDeDatos.filter(fila => {
                const nombre = fila.c[0] ? fila.c[0].v.toLowerCase() : '';
                return nombre.includes(termino);
            });
            renderizar(filtrados);
        });
    </script>
</body>
</html>
