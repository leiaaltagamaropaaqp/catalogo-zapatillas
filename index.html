<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leia Alta Gama - Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .img-vitrina { height: 200px; width: 100%; object-fit: contain; background-color: #f9fafb; border-radius: 1rem; }
        .modal-background { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); }
        .card-zapatilla { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-zapatilla:hover { transform: translateY(-5px); shadow-color: rgba(234, 179, 8, 0.4); }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-black text-white p-4 sticky top-0 z-50 border-b-2 border-yellow-500">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black italic tracking-tighter text-yellow-400">LEIA ALTA GAMA 👟</h1>
            <div class="relative w-full md:w-1/3">
                <input type="text" id="buscador" placeholder="Buscar modelo, marca o talla..." 
                    class="w-full p-2 pl-10 rounded-full text-black outline-none focus:ring-2 focus:ring-yellow-400">
                <i class="fa fa-search absolute left-3 top-3 text-gray-400"></i>
            </div>
        </div>
    </header>

    <div class="bg-blue-600 text-white text-center py-2 text-[10px] font-bold uppercase tracking-widest">
        🇵🇪 Envíos garantizados a todo el Perú (Lima, Arequipa y Provincias)
    </div>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div id="contenedor-principal" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-8">
            <div id="loading" class="col-span-full text-center py-20">
                <div class="animate-spin inline-block w-10 h-10 border-4 border-yellow-500 border-t-transparent rounded-full mb-4"></div>
                <p class="text-gray-500 font-bold">Conectando con el inventario de Google...</p>
            </div>
        </div>
    </main>

    <div id="pantallaDetalle" class="modal-background flex items-center justify-center p-4" onclick="cerrarDetalle()">
        <div class="bg-white rounded-3xl max-w-4xl w-full overflow-hidden flex flex-col md:flex-row relative" onclick="event.stopPropagation()">
            <button class="absolute top-4 right-4 text-gray-400 hover:text-black text-3xl" onclick="cerrarDetalle()">&times;</button>
            
            <div class="md:w-1/2 bg-gray-50 p-6 flex items-center justify-center">
                <img id="detalleImg" src="" class="max-h-[350px] md:max-h-[500px] w-full object-contain">
            </div>
            
            <div class="md:w-1/2 p-8 flex flex-col justify-center">
                <h2 id="detalleNombre" class="text-2xl md:text-4xl font-black text-gray-900 uppercase mb-4 leading-none"></h2>
                <div class="space-y-4 mb-8">
                    <p class="text-gray-600">Color: <span id="detalleColor" class="font-bold text-black italic"></span></p>
                    <p class="text-gray-600">Tallas: <span id="detalleTallas" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg font-bold"></span></p>
                    <div class="pt-4 border-t">
                        <p class="text-4xl font-black text-gray-900">S/ <span id="detallePrecio"></span></p>
                    </div>
                </div>
                <a id="detalleLinkWA" href="#" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-center py-4 rounded-2xl font-bold text-xl flex items-center justify-center gap-3 shadow-lg transform active:scale-95 transition-all">
                    <i class="fab fa-whatsapp text-2xl"></i> CONSULTAR STOCK
                </a>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN EXACTA
        const SHEET_ID = '1ojKX-Rl3l6Mxeaa0Uv4eemXGumfqpDCcRqVCBHtfDsI';
        const SHEET_NAME = 'Hoja1';
        const WHATSAPP = '51987840298';

        let inventarioReal = [];

        async function iniciarApp() {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
            
            try {
                const response = await fetch(url);
                const text = await response.text();
                // Limpiamos la respuesta de Google
                const rawData = JSON.parse(text.substring(47).slice(0, -2));
                inventarioReal = rawData.table.rows;
                
                document.getElementById('loading').style.display = 'none';
                renderizar(inventarioReal);
            } catch (e) {
                console.error("Error crítico:", e);
                document.getElementById('contenedor-principal').innerHTML = `<p class="col-span-full text-center text-red-500 font-bold">Error de conexión. Asegúrate que el Google Sheet sea PÚBLICO.</p>`;
            }
        }

        function renderizar(datos) {
            const container = document.getElementById('contenedor-principal');
            container.innerHTML = '';

            datos.forEach((fila) => {
                // Mapeo riguroso de columnas (Índice 0 = A, 9 = J)
                // Usamos la Columna J (Índice 9) para la imagen
                const linkImagen = fila.c[9] ? fila.c[9].v : null;
                
                // Si no hay imagen en J, probamos en I (Índice 8) por si acaso
                const imagenFinal = linkImagen || (fila.c[8] ? fila.c[8].v : null);

                if (!imagenFinal || !imagenFinal.startsWith('http')) return;

                const p = {
                    marca: fila.c[0]?.v || '',
                    color: fila.c[2]?.v || 'Multicolor',
                    precio: fila.c[4]?.v || '0',
                    tallas: fila.c[5]?.v || 'Variadas',
                    nombre: fila.c[6]?.v || 'Zapatilla Premium',
                    foto: imagenFinal
                };

                const card = document.createElement('div');
                card.className = "card-zapatilla bg-white p-4 rounded-3xl shadow-sm border border-gray-100 cursor-pointer hover:shadow-xl";
                card.onclick = () => abrirDetalle(p);
                
                card.innerHTML = `
                    <div class="relative mb-4">
                        <img src="${p.foto}" class="img-vitrina" loading="lazy" onerror="this.src='https://via.placeholder.com/300?text=Error+Link'">
                    </div>
                    <div class="text-center">
                        <h3 class="text-[11px] md:text-sm font-bold text-gray-800 uppercase truncate mb-1">${p.nombre}</h3>
                        <p class="text-blue-700 font-black text-lg md:text-2xl italic">S/ ${p.precio}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function abrirDetalle(p) {
            document.getElementById('detalleImg').src = p.foto;
            document.getElementById('detalleNombre').innerText = p.nombre;
            document.getElementById('detalleColor').innerText = p.color;
            document.getElementById('detalleTallas').innerText = p.tallas;
            document.getElementById('detallePrecio').innerText = p.precio;
            
            const textoWA = `Hola Leia Alta Gama! 👋\nMe encantó este modelo:\n*${p.nombre}*\nColor: ${p.color}\nTallas: ${p.tallas}\nPrecio: S/ ${p.precio}`;
            document.getElementById('detalleLinkWA').href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(textoWA)}`;
            
            document.getElementById('pantallaDetalle').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function cerrarDetalle() {
            document.getElementById('pantallaDetalle').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('buscador').addEventListener('input', (e) => {
            const t = e.target.value.toLowerCase();
            const filtrados = inventarioReal.filter(f => {
                const meta = `${f.c[6]?.v} ${f.c[0]?.v} ${f.c[5]?.v}`.toLowerCase();
                return meta.includes(t);
            });
            renderizar(filtrados);
        });

        iniciarApp();
    </script>
</body>
</html>
